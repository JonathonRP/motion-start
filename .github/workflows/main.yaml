name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale runs on a PR, but never cancel a `main` run: Publish is
  # chained off this workflow's completion via `workflow_run`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Check:
    name: Run svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run svelte-check
        run: bun --bun run check

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run unit tests
        run: bun --bun run test:run

      - name: Run type tests
        run: bun --bun run test:types

      - name: Run Cypress tests
        # The specs live at the repo root but drive the playground's `?test=`
        # harness, so it is the playground dev server that has to be started.
        # `dev:ci` carries the host/port flags rather than passing them through
        # `bun run --filter`, which does not forward trailing arguments.
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: bun --bun run dev:ci
          wait-on: http://localhost:5000
          wait-on-timeout: 120
