name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale runs on a PR, but never cancel a `main` run: Publish is
  # chained off this workflow's completion via `workflow_run`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Check:
    name: Run svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run svelte-check
        run: bun --bun run check

  FastTests:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run unit tests
        run: bun --bun run test:run

      - name: Run type tests
        run: bun --bun run test:types

      - name: Verify Cypress shard coverage
        run: bun --bun scripts/cypress-shard.ts --verify --shards 3

  Cypress:
    name: Cypress (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            port: 5001
          - shard: 2
            port: 5002
          - shard: 3
            port: 5003
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Select Cypress specs
        id: shard
        run: echo "specs=$(bun --bun scripts/cypress-shard.ts --shard ${{ matrix.shard }} --shards 3)" >> "$GITHUB_OUTPUT"

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: bun run --cwd sites/playground dev -- --host 0.0.0.0 --port ${{ matrix.port }} --strictPort
          wait-on: http://localhost:${{ matrix.port }}
          wait-on-timeout: 120
          spec: ${{ steps.shard.outputs.specs }}
          config: video=false,screenshotOnRunFailure=true,baseUrl=http://localhost:${{ matrix.port }}

      - name: Upload Cypress failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore

  Test:
    name: Test
    if: ${{ always() }}
    needs:
      - FastTests
      - Cypress
    runs-on: ubuntu-latest
    steps:
      - name: Require all test jobs
        env:
          FAST_TESTS_RESULT: ${{ needs.FastTests.result }}
          CYPRESS_RESULT: ${{ needs.Cypress.result }}
        run: |
          if [ "$FAST_TESTS_RESULT" != "success" ] || [ "$CYPRESS_RESULT" != "success" ]; then
            echo "Fast tests: $FAST_TESTS_RESULT"
            echo "Cypress: $CYPRESS_RESULT"
            exit 1
          fi
