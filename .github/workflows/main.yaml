name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale runs on a PR, but never cancel a `main` run: Publish is
  # chained off this workflow's completion via `workflow_run`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Check:
    name: Run svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run svelte-check
        run: bun --bun run check

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --frozen-lockfile

      - name: Run unit tests
        run: bun --bun vitest --run

      - name: Run type tests
        run: bun --bun vitest --typecheck.only

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: bun --bun run dev -- --host 0.0.0.0 --port 5000
          wait-on: http://localhost:5000
          wait-on-timeout: 120
